# .github/workflows/azure-workflow.yml
#
# push-only: this runs tables/create_tables.sql against the *production*
# Postgres server. It used to also trigger on pull_request, which ran
# untrusted/unreviewed SQL against prod before a PR was ever approved —
# now it only runs after a change has actually been merged to main (and,
# combined with main's branch protection, after review).
on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v2.3.2
    - uses: azure/login@v1                            # Azure login required to add a temporary firewall rule
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}
    - uses: azure/postgresql@v1
      with:
        server-name: rstdb.postgres.database.azure.com
        connection-string: ${{ secrets.AZURE_PSQL_CONNECTION_STRING }}
        plsql-file: './tables/create_tables.sql'
